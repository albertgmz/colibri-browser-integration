<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Colibri</title></head>
<body class="popup"><main>
<header><img src="/icons/icon-32.png" width="32" height="32" alt=""><h1 data-i18n="extName"></h1></header>
<p id="status" role="status" aria-live="polite" data-i18n="popupStatusChecking"></p>
<div class="actions"><button id="retry" data-i18n="onboardingRetry"></button><button id="setup" data-i18n="popupSetup"></button></div>
<label><input id="enabled" type="checkbox" disabled><span data-i18n="popupCapture"></span></label>
<p class="hint" data-i18n="popupCaptureHint"></p>
<label><input id="site" type="checkbox" disabled><span data-i18n="popupSite"></span></label>
<p id="siteName" class="hint"></p><p class="hint" data-i18n="popupSiteScoped"></p>
<p id="error" role="alert"></p><button id="open" data-i18n="popupOpen"></button>
<details><summary data-i18n="policyTitle"></summary><p class="hint" data-i18n="policyReadOnly"></p><div id="policy"></div></details>
<h2 data-i18n="reasonTitle"></h2><p id="explanation" role="status" aria-live="polite"></p><p class="hint" data-i18n="reasonPrivacy"></p>
<h2 data-i18n="popupRecent"></h2><ul id="recent"></ul>
</main><script type="module" src="./main.ts"></script></body></html>
